{% extends "base_saas.html" %}

{% block title %}Register - QuickFix{% endblock %}

{% block content %}

<section style="min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);">
    <div style="width: 100%; max-width: 450px;">
        <!-- Card -->
        <div class="card">
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    Join QuickFix
                </h1>
                <p style="color: #6b7280;">Create your account to get started</p>
            </div>

            <!-- Form -->
            <form method="POST" style="margin-bottom: 2rem;" id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-input" placeholder="+91 98765 43210" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem 1rem; border: 2px solid #6366f1; border-radius: 0.5rem; transition: all 0.3s; flex: 1; justify-content: center; background-color: rgba(99, 102, 241, 0.1); color: #6366f1;">
                            <input type="radio" name="role" value="user" checked style="margin: 0;" readonly>
                            <span style="font-weight: 600;">👤 User</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                </div>

                <div style="display: flex; align-items: start; gap: 0.5rem; margin-bottom: 1.5rem;">
                    <input type="checkbox" id="terms" name="terms" style="width: 18px; height: 18px; cursor: pointer; margin-top: 2px;" required>
                    <label for="terms" style="color: #6b7280; font-size: 0.9rem; cursor: pointer;">
                        I agree to the <a href="#" style="color: #6366f1; text-decoration: none;">Terms of Service</a> and <a href="#" style="color: #6366f1; text-decoration: none;">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="margin-bottom: 1rem;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Divider -->
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
                <span style="color: #9ca3af; font-size: 0.875rem;">OR</span>
                <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
            </div>

            <!-- Sign In Link -->
            <p style="text-align: center; color: #6b7280;">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" style="color: #6366f1; text-decoration: none; font-weight: 600;">Sign in</a>
            </p>
        </div>
    </div>
</section>

<script>
// Initialize on page load - user is always selected
document.addEventListener('DOMContentLoaded', function() {
    const roleLabel = document.querySelector('label:has(input[name="role"])');
    if (roleLabel) {
        roleLabel.style.borderColor = '#6366f1';
        roleLabel.style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
        roleLabel.style.color = '#6366f1';
    }
});
</script>

<style>
.form-select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s;
    background: white;
    color: #374151;
}

body.dark-mode .form-select {
    background: #1e293b;
    border-color: #334155;
    color: #f1f5f9;
}

.form-select:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-select option {
    padding: 0.5rem;
}

/* Radio button hover effects */
label:has(input[name="role"]):hover {
    border-color: #6366f1 !important;
    background-color: rgba(99, 102, 241, 0.05) !important;
}
</style>

{% endblock %}
