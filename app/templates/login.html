{% extends "base.html" %}

{% block title %}Login - Emergency & Service Finder{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-card">
            <h1>Login</h1>
            
            <form method="POST" class="form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn-primary btn-block">Login</button>
            </form>

            <p class="auth-link">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
            </p>

            <div class="demo-credentials">
                <h3>Demo Credentials</h3>
                <p><strong>Admin:</strong> admin@gmail.com / admin123</p>
                <p><strong>Provider:</strong> provider@test.com / provider123</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
