{% extends "base_saas.html" %}

{% block title %}Register - QuickFix{% endblock %}

{% block content %}

<section style="min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);">
    <div style="width: 100%; max-width: 450px;">
        <!-- Card -->
        <div class="card">
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    Join QuickFix
                </h1>
                <p style="color: #6b7280;">Create your account to get started</p>
            </div>

            <!-- Form -->
            <form method="POST" style="margin-bottom: 2rem;" id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-input" placeholder="+91 98765 43210" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; transition: all 0.3s; flex: 1; justify-content: center;">
                            <input type="radio" name="role" value="user" checked style="margin: 0;" onchange="toggleServiceType()">
                            <span style="font-weight: 600;">👤 User</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; transition: all 0.3s; flex: 1; justify-content: center;">
                            <input type="radio" name="role" value="provider" style="margin: 0;" onchange="toggleServiceType()">
                            <span style="font-weight: 600;">🔧 Provider</span>
                        </label>
                    </div>
                </div>

                <!-- Service Type Field (Hidden by default) -->
                <div class="form-group" id="serviceTypeGroup" style="display: none;">
                    <label class="form-label">Service Type</label>
                    <select name="service_type" class="form-select" id="serviceTypeSelect">
                        <option value="">Select your service type</option>
                        <option value="Electrician">⚡ Electrician</option>
                        <option value="Plumber">🔧 Plumber</option>
                        <option value="AC technician">❄️ AC technician</option>
                        <option value="House-cleaning">🧹 House-cleaning</option>
                        <option value="Carpenter">🪚 Carpenter</option>
                        <option value="Mineral Water Supplier">💧 Mineral Water Supplier</option>
                        <option value="Painter">🎨 Painter</option>
                    </select>
                </div>

                <!-- City Field (Hidden by default, only for providers) -->
                <div class="form-group" id="cityGroup" style="display: none;">
                    <label class="form-label">
                        <i class="fas fa-city" style="color: #6366f1; margin-right: 0.25rem;"></i>
                        City
                    </label>
                    <select name="city" class="form-select" id="citySelect" onchange="loadAreasForRegistration(this.value)">
                        <option value="">Select your city</option>
                        {% for city in cities %}
                        <option value="{{ city.name }}">{{ city.name }}{% if city.state %}, {{ city.state }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Area Field (Hidden by default, only for providers) -->
                <div class="form-group" id="areaGroup" style="display: none;">
                    <label class="form-label">
                        <i class="fas fa-map-pin" style="color: #10b981; margin-right: 0.25rem;"></i>
                        Area
                    </label>
                    <select name="area" class="form-select" id="areaSelect">
                        <option value="">Select city first</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                </div>

                <div style="display: flex; align-items: start; gap: 0.5rem; margin-bottom: 1.5rem;">
                    <input type="checkbox" id="terms" name="terms" style="width: 18px; height: 18px; cursor: pointer; margin-top: 2px;" required>
                    <label for="terms" style="color: #6b7280; font-size: 0.9rem; cursor: pointer;">
                        I agree to the <a href="#" style="color: #6366f1; text-decoration: none;">Terms of Service</a> and <a href="#" style="color: #6366f1; text-decoration: none;">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="margin-bottom: 1rem;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Divider -->
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
                <span style="color: #9ca3af; font-size: 0.875rem;">OR</span>
                <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
            </div>

            <!-- Sign In Link -->
            <p style="text-align: center; color: #6b7280;">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" style="color: #6366f1; text-decoration: none; font-weight: 600;">Sign in</a>
            </p>
        </div>
    </div>
</section>

<script>
function loadAreasForRegistration(cityName) {
    const areaSelect = document.getElementById('areaSelect');
    
    if (!cityName) {
        areaSelect.innerHTML = '<option value="">Select city first</option>';
        return;
    }
    
    // Show loading
    areaSelect.innerHTML = '<option value="">Loading areas...</option>';
    
    // Find city ID by name
    fetch('/admin/api/cities')
        .then(response => response.json())
        .then(cities => {
            const city = cities.find(c => c.name === cityName);
            if (city) {
                return fetch(`/admin/api/areas/${city.id}`);
            } else {
                throw new Error('City not found');
            }
        })
        .then(response => response.json())
        .then(areas => {
            let options = '<option value="">Select your area</option>';
            areas.forEach(area => {
                options += `<option value="${area.name}">${area.name}</option>`;
            });
            areaSelect.innerHTML = options;
        })
        .catch(error => {
            console.error('Error loading areas:', error);
            areaSelect.innerHTML = '<option value="">Select your area</option>';
        });
}

function toggleServiceType() {
    const roleRadios = document.querySelectorAll('input[name="role"]');
    const serviceTypeGroup = document.getElementById('serviceTypeGroup');
    const serviceTypeSelect = document.getElementById('serviceTypeSelect');
    const areaGroup = document.getElementById('areaGroup');
    const areaSelect = document.getElementById('areaSelect');
    const cityGroup = document.getElementById('cityGroup');
    const citySelect = document.getElementById('citySelect');
    const roleLabels = document.querySelectorAll('label:has(input[name="role"])');
    
    let selectedRole = '';
    roleRadios.forEach(radio => {
        if (radio.checked) {
            selectedRole = radio.value;
        }
    });
    
    // Update label styles
    roleLabels.forEach(label => {
        const radio = label.querySelector('input[name="role"]');
        if (radio.checked) {
            label.style.borderColor = '#6366f1';
            label.style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
            label.style.color = '#6366f1';
        } else {
            label.style.borderColor = '#e5e7eb';
            label.style.backgroundColor = 'transparent';
            label.style.color = '#374151';
        }
    });
    
    // Show/hide service type, city, and area fields
    if (selectedRole === 'provider') {
        serviceTypeGroup.style.display = 'block';
        serviceTypeSelect.required = true;
        cityGroup.style.display = 'block';
        citySelect.required = true;
        areaGroup.style.display = 'block';
        areaSelect.required = true;
        
        // Smooth animation
        serviceTypeGroup.style.opacity = '0';
        serviceTypeGroup.style.transform = 'translateY(-10px)';
        cityGroup.style.opacity = '0';
        cityGroup.style.transform = 'translateY(-10px)';
        areaGroup.style.opacity = '0';
        areaGroup.style.transform = 'translateY(-10px)';
        
        setTimeout(() => {
            serviceTypeGroup.style.transition = 'all 0.3s ease';
            serviceTypeGroup.style.opacity = '1';
            serviceTypeGroup.style.transform = 'translateY(0)';
            cityGroup.style.transition = 'all 0.3s ease';
            cityGroup.style.opacity = '1';
            cityGroup.style.transform = 'translateY(0)';
            areaGroup.style.transition = 'all 0.3s ease';
            areaGroup.style.opacity = '1';
            areaGroup.style.transform = 'translateY(0)';
        }, 10);
    } else {
        serviceTypeGroup.style.display = 'none';
        serviceTypeSelect.required = false;
        serviceTypeSelect.value = '';
        cityGroup.style.display = 'none';
        citySelect.required = false;
        citySelect.value = '';
        areaGroup.style.display = 'none';
        areaSelect.required = false;
        areaSelect.value = '';
    }
}

// Form validation
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const roleRadios = document.querySelectorAll('input[name="role"]');
    const serviceTypeSelect = document.getElementById('serviceTypeSelect');
    const citySelect = document.getElementById('citySelect');
    const areaSelect = document.getElementById('areaSelect');
    
    let selectedRole = '';
    roleRadios.forEach(radio => {
        if (radio.checked) {
            selectedRole = radio.value;
        }
    });
    
    // Validate service type, city, and area for providers
    if (selectedRole === 'provider') {
        if (!serviceTypeSelect.value) {
            e.preventDefault();
            alert('Please select a service type for your provider account.');
            serviceTypeSelect.focus();
            return false;
        }
        if (!citySelect.value) {
            e.preventDefault();
            alert('Please select your city for your provider account.');
            citySelect.focus();
            return false;
        }
        if (!areaSelect.value) {
            e.preventDefault();
            alert('Please select your area for your provider account.');
            areaSelect.focus();
            return false;
        }
    }
});

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    toggleServiceType();
});
</script>

<style>
.form-select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s;
    background: white;
    color: #374151;
}

body.dark-mode .form-select {
    background: #1e293b;
    border-color: #334155;
    color: #f1f5f9;
}

.form-select:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-select option {
    padding: 0.5rem;
}

/* Radio button hover effects */
label:has(input[name="role"]):hover {
    border-color: #6366f1 !important;
    background-color: rgba(99, 102, 241, 0.05) !important;
}
</style>

{% endblock %}
