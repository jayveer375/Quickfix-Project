{% extends "base_saas.html" %}

{% block title %}Edit Service - QuickFix{% endblock %}

{% block content %}
<div class="container" style="padding: 2rem 0; min-height: 80vh;">
    <div class="card" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
        <div class="text-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--dark);">Edit Service</h1>
            <p style="color: var(--gray);">Update your service information</p>
        </div>

        <form method="POST" class="form">
            <div class="form-group">
                <label for="category" class="form-label">
                    <i class="fas fa-tags" style="margin-right: 0.5rem; color: var(--primary);"></i>
                    Service Category *
                </label>
                <select name="category" id="category" required class="form-select">
                    <option value="">Select Category</option>
                    <option value="Plumber" {% if service.category == 'Plumber' %}selected{% endif %}>Plumber</option>
                    <option value="Electrician" {% if service.category == 'Electrician' %}selected{% endif %}>Electrician</option>
                    <option value="Carpenter" {% if service.category == 'Carpenter' %}selected{% endif %}>Carpenter</option>
                    <option value="Painter" {% if service.category == 'Painter' %}selected{% endif %}>Painter</option>
                    <option value="AC Repair" {% if service.category == 'AC Repair' %}selected{% endif %}>AC Repair</option>
                    <option value="Cleaning" {% if service.category == 'Cleaning' %}selected{% endif %}>Cleaning</option>
                    <option value="Other" {% if service.category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name" class="form-label">
                    <i class="fas fa-concierge-bell" style="margin-right: 0.5rem; color: var(--primary);"></i>
                    Service Name *
                </label>
                <input type="text" id="name" name="name" value="{{ service.name }}" required class="form-input" placeholder="Enter service name">
            </div>

            <div class="form-group">
                <label for="description" class="form-label">
                    <i class="fas fa-info-circle" style="margin-right: 0.5rem; color: var(--primary);"></i>
                    Description
                </label>
                <textarea id="description" name="description" rows="5" class="form-textarea" placeholder="Describe your service...">{{ service.description if service.description else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="price" class="form-label">
                    <i class="fas fa-tag" style="margin-right: 0.5rem; color: var(--primary);"></i>
                    Price
                </label>
                <input type="text" id="price" name="price" value="{{ service.price if service.price else '' }}" class="form-input" placeholder="e.g., 500-1000 PKR">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-save" style="margin-right: 0.5rem;"></i>
                    Update Service
                </button>
                <a href="{{ url_for('provider.dashboard') }}" class="btn btn-outline" style="flex: 1; text-align: center; text-decoration: none;">
                    <i class="fas fa-times" style="margin-right: 0.5rem;"></i>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
